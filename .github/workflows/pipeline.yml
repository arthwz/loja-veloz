name: Loja Veloz CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-lastest

    steps:
    - name: Baixar o codigo do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências e rodar "Testes"
      run: |
        python -m pip install --upgrade pip
        pip install flask
        python -m py_compile pedidos/app.py
        python -m py_compile estoque/app.py
        python -m py_complete pagamentos/app.py

    - name: Build das Imagens Docker
      run: |
        docker build -t loja-veloz-pedidos:latest ./pedidos
        docker build -t loja-veloz-estoque:latest ./estoque
        docker build -t loja-veloz_pagamentos:latest ./pagamentos

    - name: Simulação de Push para o Registry
      run: |
        echo "Imagens construídas com sucesso!"
        
